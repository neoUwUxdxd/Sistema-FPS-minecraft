modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="neoUwUxdxd"
description='''
Sistema de armas FPS hiperrealista: modelos 3D detallados con materiales PBR-like,
animaciones por fotogramas clave (recarga, inspección, desenfunde, ciclo de cerrojo),
retroceso físico con muelles, balanceo de arma, apuntado con mira (ADS), mira telescópica,
balística hitscan con caída de daño, disparos a la cabeza, trazadoras, casquillos y agujeros de bala.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
